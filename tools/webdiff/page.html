<!doctype html>
<!--
  webdiff/page.html — host page for one gated browser example.

  run.mjs serves this page next to the example's <name>.js/.wasm/.data and
  opens it as page.html?ex=<name>&frames=<N>. The page does for the browser
  what exdiff's fakeclock.c does on the desktop: it freezes every clock the
  library can read, so library-internal time stands still and two runs of the
  same example render the same frames. The example itself is shimmed
  (exdiff/shim.h, or c_exdiff.zig for Zig-API translations) to run N frames
  on a fixed 60 Hz frame counter and then write /exdiff.png to MEMFS.
-->
<html>
<head>
<meta charset="utf-8">
<title>webdiff</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // 2026-01-01 00:00:00 UTC, the instant fakeclock.c freezes the desktop at.
  const frozenMs = 1767225600 * 1000;
  performance.now = () => 0;
  Date.now = () => frozenMs;

  const params = new URLSearchParams(location.search);
  const name = params.get('ex');
  window.webdiff = { done: false, error: null, log: [] };

  const script = document.createElement('script');
  script.src = name + '.js';
  script.onload = () => {
    createExample({
      canvas: document.getElementById('canvas'),
      print: (text) => window.webdiff.log.push(text),
      printErr: (text) => window.webdiff.log.push(text),
      preRun: [(module) => {
        module.ENV.EXDIFF_FRAMES = params.get('frames') || '240';
        module.ENV.EXDIFF_SHOT = '/exdiff.png';
      }],
    }).then((module) => {
      window.webdiff.module = module;
    }, (error) => {
      window.webdiff.error = String(error);
    });
  };
  script.onerror = () => { window.webdiff.error = 'cannot load ' + script.src; };
  document.body.appendChild(script);
</script>
</body>
</html>
